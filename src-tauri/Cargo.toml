[package]
name = "nodepulse"
version = "1.0.0"
description = "NodePulse Cross-Platform Network Diagnostics"
authors = ["NodePulse Team"]
license = "MIT"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
