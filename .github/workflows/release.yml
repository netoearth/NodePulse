name: 🌐 Cross-Platform Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 Tag (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release 标题 (选填)'
        required: false
        default: 'NodePulse Release'
      is_prerelease:
        description: '是否为预发布版本 (Pre-release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ========================================================
  # 阶段 1: 全局静态类型检查 (仅在 Linux 上高效执行一次)
  # ========================================================
  lint-and-typecheck:
    name: 🔍 Type Check & Lint (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: 🔍 Type check (tsc --noEmit)
        run: npm run lint

  # ========================================================
  # 阶段 2: 跨平台并行打包构建 (Linux, Windows, macOS)
  # ========================================================
  build-matrix:
    name: 📦 Build (${{ matrix.platform-name }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 环境
          - os: ubuntu-latest
            platform-name: Linux-x64
            archive-type: tar-and-zip

          # Windows x64 环境
          - os: windows-latest
            platform-name: Windows-x64
            archive-type: zip-powershell

          # macOS Universal 环境
          - os: macos-latest
            platform-name: macOS-Universal
            archive-type: tar-and-zip

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Linux / macOS 纯净安装宿主平台依赖 (消除跨平台 Lockfile 导致的原生模块丢失问题)
      - name: 📦 Install dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

      # Windows 纯净安装宿主平台依赖
      - name: 📦 Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force node_modules, package-lock.json -ErrorAction SilentlyContinue
          npm install --legacy-peer-deps --no-audit --no-fund

      # 清理旧构建缓存 (Unix)
      - name: 🔧 Clear cache (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf node_modules/.tailwindcss/oxide-cache node_modules/.vite dist || true

      # 清理旧构建缓存 (Windows)
      - name: 🔧 Clear cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -Path "node_modules/.tailwindcss/oxide-cache", "node_modules/.vite", "dist" -ErrorAction SilentlyContinue

      - name: 🏗️ Build production bundle (Vite)
        run: npm run build

      # Linux / macOS 打包产物与 SHA256 校验和
      - name: 🗜️ Package Bundle (Linux / macOS)
        if: matrix.archive-type == 'tar-and-zip'
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.0"
          fi

          mkdir -p artifacts
          ZIP_NAME="NodePulse-${VERSION}-${{ matrix.platform-name }}.zip"
          TAR_NAME="NodePulse-${VERSION}-${{ matrix.platform-name }}.tar.gz"

          # 拷贝便携启动脚本
          if [ -f scripts/start.sh ]; then
            cp scripts/start.sh dist/start.sh
            chmod +x dist/start.sh
          fi

          cd dist
          zip -r "../artifacts/${ZIP_NAME}" ./*
          tar -czf "../artifacts/${TAR_NAME}" ./*
          cd ..

          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ZIP_NAME}" "${TAR_NAME}" > "checksums-${{ matrix.platform-name }}.txt"
          else
            shasum -a 256 "${ZIP_NAME}" "${TAR_NAME}" > "checksums-${{ matrix.platform-name }}.txt"
          fi
          cd ..

      # Windows 打包产物与 SHA256 校验和
      - name: 🗜️ Package Bundle (Windows)
        if: matrix.archive-type == 'zip-powershell'
        shell: pwsh
        run: |
          $VERSION = "${{ github.event.inputs.tag_name || github.ref_name }}"
          if ([string]::IsNullOrEmpty($VERSION)) {
            $VERSION = "v1.0.0"
          }

          New-Item -ItemType Directory -Force -Path "artifacts"
          $ZIP_NAME = "NodePulse-${VERSION}-${{ matrix.platform-name }}.zip"

          # 拷贝 Windows 双击启动脚本
          if (Test-Path "scripts/start.bat") {
            Copy-Item "scripts/start.bat" -Destination "dist/start.bat" -Force
          }

          Compress-Archive -Path "dist/*" -DestinationPath "artifacts/$ZIP_NAME" -Force

          $hash = (Get-FileHash -Algorithm SHA256 "artifacts/$ZIP_NAME").Hash.ToLower()
          "$hash  $ZIP_NAME" | Out-File -Encoding utf8 "artifacts/checksums-${{ matrix.platform-name }}.txt"

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform-name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 5

  # ========================================================
  # 阶段 3: 汇总全平台产物并发布 GitHub Release
  # ========================================================
  publish-release:
    name: 🚀 Publish Unified Release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Ensure Git Tag Exists (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG" || true
          fi

      - name: 📥 Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: 📋 Merge Checksums & Organize Assets
        run: |
          mkdir -p final_release
          cd release_assets
          cat checksums-*.txt > ../final_release/checksums.txt 2>/dev/null || true
          rm -f checksums-*.txt
          find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} ../final_release/ \;
          cd ..

          echo "=== 待发布的文件列表 ==="
          ls -la final_release/

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: |
            final_release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
