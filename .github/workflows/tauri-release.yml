name: 🚀 Tauri v2 Desktop Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Release Desktop Apps
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (Tauri v2 requires WebKit2GTK 4.1)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NodePulse Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 NodePulse 原生桌面客户端发布 (${{ github.ref_name }})
            
            本版本为基于 Tauri v2 构建的跨平台高性能桌面应用，拥有超低内存占用与系统原生加速。

            ### 📦 包含平台架构安装包：
            - **Windows**: `.exe` (NSIS 安装包) 与 `.msi`
            - **macOS (Universal Binary)**: `.dmg` 与 `.app` (原生同时支持 Apple Silicon M1/M2/M3/M4 及 Intel x86_64)
            - **Linux**: `.AppImage` (免安装便携版) 与 `.deb` (Debian/Ubuntu 软件包，依赖 webkit2gtk-4.1)
            
            *构建触发时间: ${{ github.event.head_commit.timestamp || 'Manual Dispatch' }}*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
