<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="180" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="6" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="130" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Satellite Nodes -->
  <circle cx="256" cy="76" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="436" cy="256" r="10" fill="#3b82f6"/>
  <circle cx="256" cy="436" r="12" fill="#10b981"/>
  <circle cx="76" cy="256" r="10" fill="#f59e0b"/>

  <!-- Central Pulse Shield -->
  <circle cx="256" cy="256" r="80" fill="url(#glowGrad)" fill-opacity="0.12" stroke="url(#glowGrad)" stroke-width="4"/>
  
  <!-- Lightning / Pulse Bolt -->
  <path d="M268 150 L190 274 L252 274 L236 362 L322 238 L260 238 Z" fill="url(#glowGrad)" filter="url(#glow)"/>
</svg>
